name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble latest site and versioned previews
        shell: bash
        run: |
          mkdir -p public/versions
          cp -R ready-for-develop/. public/

          while IFS= read -r tag; do
            mkdir -p "public/versions/$tag"
            git archive --format=tar "$tag" ready-for-develop/ \
              | tar -x --strip-components=1 -C "public/versions/$tag"
          done < <(git tag --list 'v*' --sort=version:refname)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
