name: Create versioned release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

concurrency:
  group: version-publishing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi

          site_url='https://annaadragun.github.io/amakids-franchise-landing/'
          preview_url="${site_url}versions/${TAG_NAME}/"
          {
            printf '## Published site\n\n'
            if [[ -f ready-for-develop/programs/mental-arithmetic/index.html ]]; then
              printf -- '- [Mental Arithmetic · %s](%sprograms/mental-arithmetic/)\n' "$TAG_NAME" "$preview_url"
            fi
            printf -- '- [AMAkids site · %s](%s)\n' "$TAG_NAME" "$preview_url"
            printf -- '- [Latest AMAkids site · main](%s)\n' "$site_url"
            printf '\nGitHub also attaches ZIP and TAR archives containing the complete source at this tag.\n\n'
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG_NAME"
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "$TAG_NAME" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "AMAkids franchise site ${TAG_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Register version for GitHub Pages
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create main origin/main

          if ! grep -Fxq "$TAG_NAME" .github/published-version-tags.txt 2>/dev/null; then
            printf '%s\n' "$TAG_NAME" >> .github/published-version-tags.txt
          fi

          git add .github/published-version-tags.txt
          if git diff --cached --quiet; then
            echo "$TAG_NAME is already registered."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register ${TAG_NAME} for Pages preview"
          git push origin main

      - name: Start Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --repo "$REPOSITORY" --ref main
